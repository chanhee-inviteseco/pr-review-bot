name: Review

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: '검색 대신 이 레포의 PR 하나만 (owner/repo)'
        required: false
      pr:
        description: 'PR 번호'
        required: false

permissions:
  contents: write   # keepalive 빈 커밋용. 조직 레포 접근은 GH_PAT 로만 한다

# 겹치면 줄 세운다. 앞 실행이 제출을 끝내면 뒤 실행 검색에서 빠진다.
concurrency:
  group: review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296 >/dev/null 2>&1

      # 퍼블릭 레포: 이 스텝의 출력은 고정 문구뿐이어야 한다 (scripts/review.sh 참고)
      - name: Review
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ORG: ${{ secrets.ORG }}
          ME: ${{ secrets.ME }}
          FORCE_REPO: ${{ inputs.repo }}
          FORCE_PR: ${{ inputs.pr }}
        run: bash scripts/review.sh

      - name: Keepalive
        if: always()
        run: bash scripts/keepalive.sh
