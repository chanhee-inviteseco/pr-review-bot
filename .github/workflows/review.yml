name: Review

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: '검색 대신 이 레포의 PR 하나만 (owner/repo)'
        required: false
      pr:
        description: 'PR 번호'
        required: false
      dry_run:
        description: 'true 면 리뷰를 만들기만 하고 제출하지 않는다'
        required: false
        default: 'false'

permissions:
  contents: write   # keepalive 빈 커밋용. 조직 레포 접근은 GH_PAT 로만 한다

# 겹치면 줄 세운다. 앞 실행이 제출을 끝내면 뒤 실행 검색에서 빠진다.
concurrency:
  group: review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # persist-credentials: false — GITHUB_TOKEN 을 .git/config 에 남기지 않는다(Claude 가 Read 로 읽을 수 있는 파일).
      # keepalive 푸시는 그 스텝의 env 로만 토큰을 받는다.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296 >/dev/null 2>&1

      # 퍼블릭 레포: 이 스텝의 출력은 고정 문구뿐이어야 한다 (scripts/review.sh 참고).
      # 수동 실행 입력(repo/pr/dry_run)은 env 로 넘기지 않는다 — 러너가 env 값을 로그에 찍는다.
      # 스크립트가 $GITHUB_EVENT_PATH 에서 직접 읽는다.
      - name: Review
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ORG: ${{ secrets.ORG }}
          ME: ${{ secrets.ME }}
        run: bash scripts/review.sh

      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/keepalive.sh
